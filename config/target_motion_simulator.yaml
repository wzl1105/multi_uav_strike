# ============================================================================
# target_motion_simulator_node 专属参数(2026-07 多目标改造)
#
# targets: 目标列表,支持不同类别 + 同类别多实例。每项字段:
#   label              类别("person"/"car"/"truck"...),与 YOLO label 语义一致
#   x_init, y_init     初始位置(米,NWU)
#   max_speed          最大速度(m/s;设 0 = 静止目标)
#   min_speed          最小速度(m/s)
#   max_tangential_acc 最大切向加速度(m/s²)
#   max_normal_acc     最大法向加速度(m/s²)
# 缺省字段回落到下方全局默认值(删任意一行都不会让行为突然变化)。
# ============================================================================
targets:
  # ===== 静止人员 (基础回归:hit_count 晋升 + 多目标不串) =====
  - {label: "person", x_init:  60.0, y_init: -100.0, max_speed: 0.0}    # 原:静止人 1 (116m)
  - {label: "person", x_init:   0.0, y_init: -205.0, max_speed: 1.0, max_normal_acc: 0.5}  # 原:慢速人 (205m)
  - {label: "person", x_init:  90.0, y_init:  -50.0, max_speed: 0.0}    # 静止人 2 (NE 102m)
  - {label: "person", x_init: -50.0, y_init: -150.0, max_speed: 0.0}    # 静止人 3 (SW 158m)
  - {label: "person", x_init: 130.0, y_init: -100.0, max_speed: 0.0}    # 静止人 4 (E 164m)

  # # ===== 移动人员 (验证 EMA 世界域跟随相机机动) =====
  # - {label: "person", x_init:  30.0, y_init: -120.0, max_speed: 2.0, max_tangential_acc: 1.0, max_normal_acc: 0.8}   # 行人 2m/s
  # - {label: "person", x_init: -80.0, y_init:  -60.0, max_speed: 1.5, max_normal_acc: 0.5}                            # 行人 1.5m/s
  # - {label: "person", x_init: 100.0, y_init: -200.0, max_speed: 0.5, max_normal_acc: 0.3}                            # 慢移老人 0.5m/s

  # # ===== 车辆 (验证 label-only 匹配,不该与人合并) =====
  # - {label: "car",    x_init: 100.0, y_init: -180.0, max_speed: 5.0, max_tangential_acc: 2.0, max_normal_acc: 1.0}   # 5m/s 慢速车
  # - {label: "car",    x_init: -120.0, y_init: -100.0, max_speed: 8.0, max_tangential_acc: 3.0, max_normal_acc: 1.5}  # 8m/s 较快车
  # - {label: "truck",  x_init:  50.0, y_init: -250.0, max_speed: 4.0, max_tangential_acc: 1.5, max_normal_acc: 0.8}   # 卡车 (远距 256m,验证反向视角投影)

# /target_position(Point,兼容 topic)取哪个目标作为主目标
# === 2026-07-26: 修复 ===
#   原 primary_index: 10 超出 targets 数组长度(targets 只有 2 项),
#   target_motion_simulator_node.cpp:139-141 自动 fallback 到 0(x=60,y=-100 不是用户真目标),
#   导致 guidance_control_node 算 STRIKE EVAL min_dist 永远偏大(141m).
#   /target_position 现在 strike_eval 已停用(enable_strike_evaluation=false),
#   但这个字段仍是真值,改 1 = targets[1] = (x=0, y=-205, 慢速人),用户真目标。
primary_index: 1

# ===== 全局默认运动参数(targets 项缺省时回落;同时兼容旧单目标 x_init/y_init/label) =====
max_speed: 0.01            # 最大速度(m/s)
min_speed: 0.0             # 最小速度(m/s)
max_tangential_acc: 0.0    # 最大切向加速度(m/s²)
max_normal_acc: 0.0        # 最大法向加速度(m/s²)
sim_freq: 100.0            # 仿真频率(Hz)
trigger_freq: 0.1          # 加减速触发频率(Hz)
marker_size: 1.0           # 目标标记大小
marker_frame: "map"        # 目标标记参考坐标系
