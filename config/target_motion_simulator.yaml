# ============================================================================
# target_motion_simulator_node 专属参数(2026-07 多目标改造)
#
# !!! 坐标系约定(2026-08-24 注释,避免反复踩坑) !!!
#   x_init / y_init 是 NWU(北西上,right-handed):
#     x 正 = 北 (North),  x 负 = 南 (South)
#     y 正 = 西 (West),   y 负 = 东 (East)
#     (z 由后续 home_alt + 仿真过程累加,不在 yaml)
#   例:x_init=-50, y_init=-150  →  南 50m,东 150m (东南方向,绝对距离 ≈158m)
#   例:x_init= 60, y_init=-100  →  北 60m,东 100m (东北方向,≈117m)
#   这个跟 ROS REP-103 / NED 都不同,写之前先想清楚:
#     NED: x=北, y=东, z=下   (PX4 SITL mavros local_position/pose 是 NED)
#     ENU: x=东, y=北, z=上   (REP-103 ROS 标准)
#     NWU: x=北, y=西, z=上   (本项目内部)
#   target_estimator_node 的 c.ned_x/ned_y 命名其实都是 NWU,
#   mission_manager_node 注释已纠正 ("此前注释写 NED 是错的")。
#
# targets: 目标列表,支持不同类别 + 同类别多实例。每项字段:
#   label              类别("person"/"car"/"truck"...),与 YOLO label 语义一致
#   x_init, y_init     初始位置(米,NWU,见上方坐标系约定)
#   max_speed          最大速度(m/s;设 0 = 静止目标)
#   min_speed          最小速度(m/s)
#   max_tangential_acc 最大切向加速度(m/s²)
#   max_normal_acc     最大法向加速度(m/s²)
# 缺省字段回落到下方全局默认值(删任意一行都不会让行为突然变化)。
# ============================================================================
# === 2026-08-24: 单目标隔离模式 (debug orange ball / stale_freeze / fallback) ===
#   场上只留 1 个目标: x_init=-50(南50m),y_init=-150(东150m)→ 东南158m,attack_point
#   max_speed=0/min_speed=0 静止。还原方法:把以下 # 注释的目标行全部删 # 即可
#   恢复原 14 目标配置。
#   隔离目的:
#     1) stale 之后 fallback 没候选 → primary 必然为 0 → 橙色球必然不出现
#     2) 排除其他 cluster 抢占 primary / 多目标 hit_count 干扰
#     3) YOLO 投影几何错误只剩一个对比样本,容易诊断
targets:
  # ============================================================================
  # === 2026-08-25: 14 辆全车 17m/s 群 (压力测 chase 跟踪极限 + 聚类 + strike) ===
  #   全部 car, 全部 max_speed=17 (用户口径上限)
  #   min_speed=10 防目标减速到静止被 KF 当 STATIC
  #   距离 70~160m 全圈 16 方位覆盖
  #   坐标全 NWU (x=北+,y=西+;东是 y 负)
  # ============================================================================

  # ----- 14 辆车, 全部 17 m/s -----
  # - {label: "car", x_init:  80.0, y_init:    0.0, max_speed: 17.0, min_speed: 10.0, max_tangential_acc: 4.0, max_normal_acc: 2.5}    # N    80m
  # - {label: "car", x_init: 100.0, y_init:  -45.0, max_speed: 17.0, min_speed: 10.0, max_tangential_acc: 4.0, max_normal_acc: 2.5}    # NNE 110m
  # - {label: "car", x_init:  70.0, y_init:  -55.0, max_speed: 17.0, min_speed: 10.0, max_tangential_acc: 4.0, max_normal_acc: 2.5}    # NE   89m
  # - {label: "car", x_init:  75.0, y_init: -105.0, max_speed: 17.0, min_speed: 10.0, max_tangential_acc: 4.0, max_normal_acc: 2.5}    # ENE 130m
  # - {label: "car", x_init:   0.0, y_init: -100.0, max_speed: 17.0, min_speed: 10.0, max_tangential_acc: 4.0, max_normal_acc: 2.5}    # E   100m
  # - {label: "car", x_init: -90.0, y_init: -120.0, max_speed: 17.0, min_speed: 10.0, max_tangential_acc: 4.0, max_normal_acc: 2.5}    # ESE 150m
  # - {label: "car", x_init: -90.0, y_init:  -95.0, max_speed: 17.0, min_speed: 10.0, max_tangential_acc: 4.0, max_normal_acc: 2.5}    # SE  131m
  # - {label: "car", x_init: -65.0, y_init:  -25.0, max_speed: 17.0, min_speed: 10.0, max_tangential_acc: 4.0, max_normal_acc: 2.5}    # SSE  70m
  # - {label: "car", x_init: -80.0, y_init:    0.0, max_speed: 17.0, min_speed: 10.0, max_tangential_acc: 4.0, max_normal_acc: 2.5}    # S    80m
  # - {label: "car", x_init: -100.0, y_init:   45.0, max_speed: 17.0, min_speed: 10.0, max_tangential_acc: 4.0, max_normal_acc: 2.5}    # SSW 110m
  # - {label: "car", x_init: -100.0, y_init:   95.0, max_speed: 17.0, min_speed: 10.0, max_tangential_acc: 4.0, max_normal_acc: 2.5}    # SW  138m
  # - {label: "car", x_init: -55.0, y_init:  150.0, max_speed: 17.0, min_speed: 10.0, max_tangential_acc: 4.0, max_normal_acc: 2.5}    # WSW 160m
  # - {label: "car", x_init:   0.0, y_init:  120.0, max_speed: 17.0, min_speed: 10.0, max_tangential_acc: 4.0, max_normal_acc: 2.5}    # W   120m
  # - {label: "car", x_init:  60.0, y_init:   65.0, max_speed: 17.0, min_speed: 10.0, max_tangential_acc: 4.0, max_normal_acc: 2.5}    # WNW  88m

  # ===== 旧 14 目标配置存档 (留作参考) =====
  - {label: "person", x_init:  60.0, y_init: -100.0}    # 原:静止人 1 (116m)
  - {label: "person", x_init:   0.0, y_init: -205.0}    # 原:慢速人 (205m)
  - {label: "person", x_init:  90.0, y_init:  -50.0}    # 原:静止人 2 (NE 102m)
  - {label: "car",    x_init: -50.0, y_init: -150.0}    # 原:静止人 3 (SW 158m,attack_point) → 2026-08-27: 改 car, 测 label 过滤 fallback
  - {label: "person", x_init: 130.0, y_init: -100.0}    # 原:静止人 4 (E 164m)
  - {label: "person", x_init: -35.0, y_init: -150.0}    # E   (~15m 扎堆)
  - {label: "person", x_init: -65.0, y_init: -150.0}    # W   (~15m 扎堆)
  - {label: "person", x_init: -50.0, y_init: -135.0}    # N   (~15m 扎堆)
  - {label: "person", x_init: -50.0, y_init: -165.0}    # S   (~15m 扎堆)
  - {label: "person", x_init: -39.0, y_init: -139.0}    # NE  (~15.6m 扎堆)
  - {label: "person", x_init: -61.0, y_init: -161.0}    # SW  (~15.6m 扎堆)
  - {label: "person", x_init: -39.0, y_init: -161.0}    # NW  (~15.6m 扎堆)
  - {label: "person", x_init: -61.0, y_init: -139.0}    # SE  (~15.6m 扎堆)
  - {label: "car",    x_init: -30.0, y_init: -130.0}    # NE car (~28.5m,gate 边界)
  - {label: "person", x_init: -15.0, y_init: -130.0}    # NE far (~40m,**超 gate 应被拒**)
  - {label: "person", x_init:  30.0, y_init: -120.0, max_speed: 2.0}   # 行人 2m/s
  - {label: "person", x_init: -80.0, y_init:  -60.0, max_speed: 1.5}   # 行人 1.5m/s
