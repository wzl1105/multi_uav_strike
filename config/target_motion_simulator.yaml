# ============================================================================
# target_motion_simulator_node 专属参数(2026-07 多目标改造)
#
# !!! 坐标系约定(2026-08-24 注释,避免反复踩坑) !!!
#   x_init / y_init 是 NWU(北西上,right-handed):
#     x 正 = 北 (North),  x 负 = 南 (South)
#     y 正 = 西 (West),   y 负 = 东 (East)
#     (z 由后续 home_alt + 仿真过程累加,不在 yaml)
#   例:x_init=-50, y_init=-150  →  南 50m,东 150m (东南方向,绝对距离 ≈158m)
#   例:x_init= 60, y_init=-100  →  北 60m,东 100m (东北方向,≈117m)
#   这个跟 ROS REP-103 / NED 都不同,写之前先想清楚:
#     NED: x=北, y=东, z=下   (PX4 SITL mavros local_position/pose 是 NED)
#     ENU: x=东, y=北, z=上   (REP-103 ROS 标准)
#     NWU: x=北, y=西, z=上   (本项目内部)
#   target_estimator_node 的 c.ned_x/ned_y 命名其实都是 NWU,
#   mission_manager_node 注释已纠正 ("此前注释写 NED 是错的")。
#
# targets: 目标列表,支持不同类别 + 同类别多实例。每项字段:
#   label              类别("person"/"car"/"truck"...),与 YOLO label 语义一致
#   x_init, y_init     初始位置(米,NWU,见上方坐标系约定)
#   max_speed          最大速度(m/s;设 0 = 静止目标)
#   min_speed          最小速度(m/s)
#   max_tangential_acc 最大切向加速度(m/s²)
#   max_normal_acc     最大法向加速度(m/s²)
# 缺省字段回落到下方全局默认值(删任意一行都不会让行为突然变化)。
# ============================================================================
# === 2026-08-24: 单目标隔离模式 (debug orange ball / stale_freeze / fallback) ===
#   场上只留 1 个目标: x_init=-50(南50m),y_init=-150(东150m)→ 东南158m,attack_point
#   max_speed=0/min_speed=0 静止。还原方法:把以下 # 注释的目标行全部删 # 即可
#   恢复原 14 目标配置。
#   隔离目的:
#     1) stale 之后 fallback 没候选 → primary 必然为 0 → 橙色球必然不出现
#     2) 排除其他 cluster 抢占 primary / 多目标 hit_count 干扰
#     3) YOLO 投影几何错误只剩一个对比样本,容易诊断
targets:
  # ============================================================================
  # === 2026-08-25: 恢复多目标混合群 (压力测 KF + 聚类 + chase + strike 选目标) ===
  #   13 个目标 = 3 静态 person + 3 慢移 person + 4 中速车 + 3 快移车
  #   距离 50~180m 全圈覆盖,8 方位都有,运动/静止混合
  #   车 ≤17m/s 符合用户口径;人 ≤2m/s 行人级
  #   坐标全 NWU (x=北+,y=西+;东是 y 负)
  # ============================================================================

  # ----- 静态 person (3 个,验证 hit_count 晋升 + 多目标不串) -----
  - {label: "person", x_init:  60.0, y_init:    0.0, max_speed: 0.0, min_speed: 0.0}    # N  60m,  静态
  - {label: "person", x_init:   0.0, y_init:  -90.0, max_speed: 0.0, min_speed: 0.0}    # E  90m,  静态
  - {label: "person", x_init: -50.0, y_init:   30.0, max_speed: 0.0, min_speed: 0.0}    # S  58m,  静态

  # ----- 慢移 person (3 个,行人级 0.5~2.0 m/s) -----
  - {label: "person", x_init:  60.0, y_init:  -50.0, max_speed: 1.5, min_speed: 0.8, max_tangential_acc: 1.0, max_normal_acc: 0.5}    # NE 78m,  1.5m/s 行人
  - {label: "person", x_init: -50.0, y_init:   50.0, max_speed: 1.0, min_speed: 0.5, max_tangential_acc: 0.8, max_normal_acc: 0.4}    # SW 71m,  1.0m/s 行人
  - {label: "person", x_init:  80.0, y_init:   60.0, max_speed: 0.5, min_speed: 0.2, max_tangential_acc: 0.5, max_normal_acc: 0.3}    # NW 100m, 0.5m/s 慢老人

  # ----- 中速车 (4 个,5~10 m/s 城市道路) -----
  - {label: "car",    x_init:   0.0, y_init: -120.0, max_speed:  8.0, min_speed: 4.0, max_tangential_acc: 3.0, max_normal_acc: 1.5}  # E  120m, 8m/s
  - {label: "car",    x_init: -80.0, y_init: -100.0, max_speed: 10.0, min_speed: 5.0, max_tangential_acc: 3.5, max_normal_acc: 1.8}  # SE 128m, 10m/s
  - {label: "car",    x_init:   0.0, y_init:  140.0, max_speed:  6.0, min_speed: 3.0, max_tangential_acc: 2.5, max_normal_acc: 1.2}  # W  140m, 6m/s
  - {label: "car",    x_init:  60.0, y_init:  -70.0, max_speed:  5.0, min_speed: 2.5, max_tangential_acc: 2.0, max_normal_acc: 1.0}  # NE 92m,  5m/s

  # ----- 快移车 (3 个,12~17 m/s 高速,验证 chase 跟踪极限) -----
  - {label: "car",    x_init: 150.0, y_init:    0.0, max_speed: 17.0, min_speed: 10.0, max_tangential_acc: 4.0, max_normal_acc: 2.5} # N  150m, 17m/s 极速
  - {label: "car",    x_init:   0.0, y_init: -180.0, max_speed: 14.0, min_speed:  8.0, max_tangential_acc: 3.5, max_normal_acc: 2.0} # E  180m, 14m/s
  - {label: "car",    x_init: -120.0, y_init: -100.0, max_speed: 12.0, min_speed:  7.0, max_tangential_acc: 3.0, max_normal_acc: 1.8} # SE 156m, 12m/s

  # ===== 旧 14 目标配置存档 (留作参考) =====
  # - {label: "person", x_init:  60.0, y_init: -100.0}    # 原:静止人 1 (116m)
  # - {label: "person", x_init:   0.0, y_init: -205.0}    # 原:慢速人 (205m)
  # - {label: "person", x_init:  90.0, y_init:  -50.0}    # 原:静止人 2 (NE 102m)
  # - {label: "person", x_init: -50.0, y_init: -150.0}    # 原:静止人 3 (SW 158m,attack_point)
  # - {label: "person", x_init: 130.0, y_init: -100.0}    # 原:静止人 4 (E 164m)
  # - {label: "person", x_init: -35.0, y_init: -150.0}    # E   (~15m 扎堆)
  # - {label: "person", x_init: -65.0, y_init: -150.0}    # W   (~15m 扎堆)
  # - {label: "person", x_init: -50.0, y_init: -135.0}    # N   (~15m 扎堆)
  # - {label: "person", x_init: -50.0, y_init: -165.0}    # S   (~15m 扎堆)
  # - {label: "person", x_init: -39.0, y_init: -139.0}    # NE  (~15.6m 扎堆)
  # - {label: "person", x_init: -61.0, y_init: -161.0}    # SW  (~15.6m 扎堆)
  # - {label: "person", x_init: -39.0, y_init: -161.0}    # NW  (~15.6m 扎堆)
  # - {label: "person", x_init: -61.0, y_init: -139.0}    # SE  (~15.6m 扎堆)
  # - {label: "car",    x_init: -30.0, y_init: -130.0}    # NE car (~28.5m,gate 边界)
  # - {label: "person", x_init: -15.0, y_init: -130.0}    # NE far (~40m,**超 gate 应被拒**)
  # - {label: "person", x_init:  30.0, y_init: -120.0, max_speed: 2.0}   # 行人 2m/s
  # - {label: "person", x_init: -80.0, y_init:  -60.0, max_speed: 1.5}   # 行人 1.5m/s
  # - {label: "person", x_init: 100.0, y_init: -200.0, max_speed: 0.5}   # 慢老人 0.5m/s
  # - {label: "car",    x_init: 100.0, y_init: -180.0, max_speed: 5.0}   # 5m/s 慢速车
  # - {label: "car",    x_init: -120.0, y_init: -100.0, max_speed: 8.0}  # 8m/s 较快车
  # - {label: "truck",  x_init:  50.0, y_init: -250.0, max_speed: 4.0}   # 卡车

# /target_position(Point,兼容 topic)取哪个目标作为主目标
# === 2026-07-26: 修复 ===
#   原 primary_index: 10 超出 targets 数组长度(targets 只有 2 项),
#   target_motion_simulator_node.cpp:139-141 自动 fallback 到 0(x=60,y=-100 不是用户真目标),
#   导致 guidance_control_node 算 STRIKE EVAL min_dist 永远偏大(141m).
#   /target_position 现在 strike_eval 已停用(enable_strike_evaluation=false),
#   但这个字段仍是真值。单目标隔离下只有 index 0 (=唯一目标) 有效。
primary_index: 0

# ===== 全局默认运动参数(targets 项缺省时回落;同时兼容旧单目标 x_init/y_init/label) =====
# === 2026-08-23: 全部动起来,验证 KF + lead_pose ===
#   max_speed=20 给 17 m/s 用户口径目标留 18% 余量;min_speed=5 防目标停止移动。
#   max_tangential_acc=1.0 / max_normal_acc=1.5 让目标变向自然(不瞬时 90° 转弯)。
max_speed: 20.0            # 最大速度 (m/s) — 用户口径 ≤17, 留 18% 余量
min_speed: 5.0             # 最小速度 (m/s) — 防目标静止被 KF 当 STATIC
max_tangential_acc: 1.0    # 最大切向加速度 (m/s²)
max_normal_acc: 1.5        # 最大法向加速度 (m/s²)
sim_freq: 100.0            # 仿真频率(Hz)
trigger_freq: 0.1          # 加减速触发频率(Hz)
marker_size: 1.0           # 目标标记大小
marker_frame: "map"        # 目标标记参考坐标系
