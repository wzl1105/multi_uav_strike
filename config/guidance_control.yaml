# ============================================================================
# guidance_control_node 专属参数
# 共享参数（use_sim / ref_lat/lon/alt / flight_mode_* / strike_* / los_kp_*）
# 已在 common.yaml 中定义，由 launch 加载到本节点的私有命名空间。
# ============================================================================

# 制导策略
guidance_strategy: "intercept"   # intercept / minsnap / los

# //===================制导修改====================
# STRIKE 主逻辑：image_geo_fallback=图像视线优先，图像过期后用世界坐标纯追踪；
# pn=融合main分支增强后的比例导引；legacy_pn作为pn的兼容别名。
# === 2026-08-19: image_geo_fallback → pn (uav0_strike_2026-08-19-15-39-13_0.bag) ===
#   image_geo_fallback 的偏航角控制走 atan2(target_bearing) - current_yaw,
#   UAV 起点 (76,4,20) heading 1°(北)、目标 bearing 233°(西南) 时,yaw_error ≈ -128°
#   应走 CW 短边 128°,但反馈链路上 EMA(image_ray_alpha=0.25) + yaw_kp 反复
#   触发 target_bearing 振荡,yaw 在 3s 内绕 332°(CCW 长边),期间相机始终
#   不朝向目标 → image_visible_timeout_sec=0.4 触发 → GEO_FALLBACK → 又拉回
#   bearing → 反复,导致大绕圈。
#   PN (InterceptGuidance) 的速度向量来自 LOS-rate + 前置角约束,yaw 跟速度向量
#   走,无 wrap bug,也不会因目标位置 EMA 滞后反复拉扯。
strike_guidance_logic: "pn"
# 实际速度仍完全来自 Attack Skill.task_speed；这里只做第二层硬上限保护。
attack_max_speed: 40.0

# cluster 已在 Attack 阶段通过 6-hit 晋升门槛；guidance 收到一帧新的可见主目标
# 就切 IMAGE，满足“只要看得见就用图像导引”。
image_confirm_frames: 1
# 锁定目标图像观测超过此时间视为不可见，转世界坐标纯追踪；长时丢失仍由
# mission_manager 的 target_lost_hold_sec 进入 TARGET_LOST_HOVER。
#
# === 2026-10-14: 放宽 0.4 → 1.0 治本 chase bbox 抖动 (multi_uav_flight_13_0.bag) ===
#   13_0.bag: chase 3.67m/s + yaw 0.5rad/s 让 bbox 1s 内漂出, 0.4s timeout 太严
#   image 切到 GEO_FALLBACK 频繁, 飞机看着像 "卡顿"。放宽到 1.0s 让 image 容忍更久
#   再切 GEO, 跟 strike_terminal_no_image_hold_enabled=false (关 LATCH) 配合
#   让 chase 持续飞不卡。
image_visible_timeout_sec: 1.0
# IMAGE/GEO 两种速度源切换时的线性混合时间。
image_reacquire_blend_sec: 0.7
#========速度修改========
# 保留旧参数供回退；当前 IMAGE/GEO 不再用它截断速度，水平速度直接来自 Attack task_speed。
image_max_speed: 5.0
# 地面站 task_speed 是水平速度上限；10m内连续减速，避免高速穿过3m提交区。
strike_terminal_speed_schedule_enabled: true
#========速度修改========
# === 2026-08-20: 图像居中终端冲刺 (image-terminal chase) ===
#   当相机射线已锁定目标、bbox 在 deadband 内、且已进入 ~10m 命中圈附近时,
#   直接沿相机射线 3D 全速冲向, 跳过 terminalHorizontalSpeed / feasibleHorizontalSpeedForDescent
#   / computeSlantDescentSpeed / enforcePreCommitAltitudeGuard 全部前馈钳位.
#   远距图像 bbox 噪抖对世界角度影响放大, 仍走 PN/GEO 钳位;
#   近距视差小、图像是最高精度输入, 完全信任.
#   "图像丢了" 判定 = !image_ready (visible=false 或 image_age > image_visible_timeout_sec_)
#   sticky_latch_sec: 进入 chase 后最少保持 X 秒, 容忍 bbox 短暂抖动 (1-2 帧 visible=false)
#   不在 chase/GEO 之间反复切. 超过 latch 仍 image_ready 才允许退出.
strike_terminal_image_chase_enabled: true
strike_terminal_image_chase_min_horiz_m: 30.0
# === 2026-10-14: 放宽 0.5 → 2.0 让 chase sticky 更长 (13_0.bag) ===
#   13_0.bag: chase 几何让 bbox 抖动, 0.5s sticky 太短 → 频繁 image→GEO 切换
#   放宽到 2.0s 容忍 bbox 抖动 1-2s, 让 chase 不切走
strike_terminal_image_chase_latch_sec: 2.0
# 进入上述图像导引区时，如果图像已超过 image_visible_timeout_sec，立即锁存
# 当前 position setpoint。该悬停不是最终打击保护，不会触发拉烟。
#
# === 2026-10-14: 关 LATCH 让 chase 继续飞 (multi_uav_flight_13_0.bag 治本) ===
#   13_0.bag 复盘: chase 几何 (3.67m/s + yaw 0.5rad/s) 让 bbox 1s 内漂出 FOV →
#   LATCH 立即触发 (5s hold) → 5s 后 auto-unlatch → chase 重启 → image 又丢 →
#   LATCH 立即再触发。5s hold + 1-2s chase 循环震荡, 永远到不了 15m arm 距离。
#   用户口径"丢了也要继续前进, 不要 hold"。改 false 后:
#     - LATCH 永远不触发 → chase 持续飞 → 不用 5s 5s 等待
#     - strike commit 用 target_estimated_pose (GNSS) 不依赖 image,
#       接近 15m GNSS 几何就会 commit, 真正"盲打"靠 GNSS
#   风险: 目标移动可能打空。需在真机用静态目标验证, 移动目标建议保留 LATCH。
strike_terminal_no_image_hold_enabled: false
# === latched 自动解除 (治本 NO-IMAGE GUARD 死锁) ===
#   修前: latched 后永远 hold → 22s 卡死, 没 strike commit, 没拉烟 (09-09-36 bag)。
#   修后: elapsed > max_sec (5s 默认) 自动 unlatch, 释放 chase 让 GEO/PN 重新尝试。
#   5s 留足 chase sticky 0.5s + bbox 抖动 1-2 帧 + 重试窗口, 避免过短导致 chase
#   抖动循环 unlatch/re-latch。范围至少 0.5s (clamp 防 yaml 误设 0)。
strike_terminal_no_image_hold_max_sec: 5.0
# chase 用更宽的居中死区 (vs image_center_deadband 0.03),17-43-21 bag 在 horiz=1.37m
# 时 bbox 漂出 0.06 带导致 chase 提前退出,放大到 0.10 允许更大波动,让 chase
# 能覆盖到命中圈边缘。ray 在 ~1m 内仍可信任,过宽反而引入错误方向。
#
# === 2026-10-14: 放宽 0.4 → 0.5 治本 chase 几何 (13_0.bag) ===
#   13_0.bag: chase 几何让 bbox 漂到 0.9+ (出 0.4 死区), 提前退出 chase 切 GEO
#   0.4 → 0.5 (代码 clamp 上限) 让 bbox 偏离更多仍算"对准", 减少 image→GEO 切换
strike_terminal_image_chase_center_band: 0.5

# //=============打击保护bbox=========//
# 测试模式：使用归一化 bbox 等效边长 sqrt(width * height)，不依赖图像分辨率。
# bbox 连续达到 hover 阈值，或本地高度低于安全阈值时，直接锁存悬停。
# 未达到悬停条件时不再进行渐进减速。
# 真实打击前必须将 strike_test_guard_enabled 改为 false。
strike_test_guard_enabled: true
# 只有水平距离进入该范围后才锁存开启 bbox 判断，远距离大框不会触发停车。
strike_test_guard_arm_distance_m: 15.0
# 未识别为人员或车辆时使用的兼容回退阈值。
strike_test_bbox_hover_threshold: 0.18
# 依据人员与车辆实测分别设置：人员框较小，车辆框较大。
strike_test_bbox_person_threshold: 0.11
strike_test_bbox_vehicle_threshold: 0.30
# bbox 只允许在本地高度不高于 10m 时累计确认，避免车辆大框在高空提前停车。
# 该参数不会在 10m 主动触发；bbox 未达标时继续接近，最低仍由 4m 硬保护兜底。
strike_test_bbox_trigger_max_altitude_m: 10.0
# 高度硬保护使用 MAVROS local_position 转换后的 NWU 本地高度，
# 不依赖 bbox、目标距离或近区布防；低于或等于 4m 立即锁存悬停。
strike_test_altitude_guard_enabled: true
strike_test_min_altitude_m: 4.0
# 0.50 覆盖整个归一化画面，避免近距离目标偏到画面边缘时保护失效；
# primary_image_target、visible 和 confidence 仍负责筛除非主目标及低置信度检测。
strike_test_bbox_center_band: 0.50
strike_test_bbox_min_confidence: 0.70
strike_test_bbox_confirm_frames: 5
strike_test_bbox_timeout_sec: 0.4
strike_test_bbox_filter_alpha: 0.4

# 拉烟请求在打击保护 Position Hold 锁存后即触发一次(原"飞机连续稳定 0.2s"
# 等待已删除,实测会让还在减速中的 UAV 永远达不成速度阈值而不触发)。
# 默认关闭，避免仿真、回放或普通启动时向真实 YX 载荷发送 0x4E。
strike_test_smoke_enabled: false
# yx_comm.launch 默认在根命名空启动，因此使用绝对 Service 名。
strike_test_smoke_service: "/trigger_smoke"
# //=============打击保护bbox=========//

# === 2026-10-10: 手动拉烟双入口(rc_in 杆量 + ros topic) ===
# 现场反馈 strike_test_smoke 自动路径偶尔不触发(可能是稳定条件过严或硬件),
#   补一条手动入口作为现场兜底。armed-only 门控已写在 tryManualSmokeTrigger
#   里,不必再额外配。
# 两路入口互不影响,可独立开关,内部 1.0s 最小间隔防连发。
# 默认 rc_enabled=false(topic 路径默认开),用户用 topic 按钮或后续硬件触发。
manual_smoke_rc_enabled: true
# 通道号按遥控器界面从 1 开始,先用 rostopic echo /uav0/mavros/rc/in 确认。
manual_smoke_rc_channel: 5
# 高/低阈值形成迟滞,中间区间不响应,避免 PWM 抖动反复触发。
manual_smoke_rc_on_pwm: 1600
manual_smoke_rc_off_pwm: 1700
# RC 消息超时不再触发(只是日志告警,真正触发每次 callback 仍按瞬时 PWM)。
manual_smoke_rc_timeout_sec: 1.0
# topic 入口:发 True 边沿触发一次,持续 True 不会反复触发。
manual_smoke_topic_enabled: true
manual_smoke_topic: "/yx/cmd/trigger_smoke"
# 地面手动测试用: true 时 disarm 状态也能手动触发拉烟。现场测完务必改回 false
# (yaml 默认 false,launch 也别覆盖)。设 true 时任何 topic True 边沿或 RC 杆量都会
# 直接向 YX 板发 0x4E,地面开机要小心。
manual_smoke_bypass_armed_gate: true

# === 2026-08-28: TRACK/STRIKE 共享 strike_terminal_image_chase_* 一组参数 ===
#   2026-08-25 引入的 4 个 track_* 独立参数已删除。TRACK 阶段 GS 未发
#   attack_cmd action=0 时不下沉 (helper 顶部 attack_cmd gate 只挡 TRACK);
#   发了之后跟 STRIKE 一样进 chase 几何。STRIKE 默认就要开 chase,
#   不再等 attack_cmd (用户口径"GS 在发 105 技能的时候默认就是要开打击")。
# //===================制导修改====================
# image_max_vertical_speed: 1.0
image_max_vertical_speed: 2.0
# IMAGE/GEO与PN共用动态下降：以2米命中圈为时间基准，垂直到达额外滞后，
# 且使用与MissionManager命中判定同源的实时目标坐标。
strike_slant_descent_enabled: true
strike_slant_descent_max_angle_deg: 30.0
# 1m内若仍有较大高度误差，退出斜线计算并保留垂直下降安全兜底。
strike_slant_min_horizontal_distance_m: 1.0
# //===================制导修改====================
# bbox 中心死区、世界视线 EMA 以及偏航速率限制。
image_center_deadband: 0.03
image_ray_alpha: 0.25
image_yaw_kp: 0.6
# === 2026-10-13: chase 动目标 yaw 裕度 (uav0_strike_2026-10-13-23-28-49_0.bag) ===
#   0.5 rad/s = 28.6°/s, 跟不上 chase 末段目标转向峰值 30°/s (跟丢根因).
#   实际 gimbal 物理上限 ~0.4 rad/s (servo 机械), PX4 内部 MAVLINK_RATE_LIMIT
#   兜底, 算法层面给 0.8 rad/s (45.8°/s) 让 desired_yaw_rate 跟 ray 角速度同步,
#   避免 body_yaw 跟 image_ray 错位累积超 80° → bbox 出 FOV 失锁.
#   仍是 saturate, 真追不上时 gimbal 物理卡 0.4, 算法不会暴冲.
image_yaw_rate_max: 0.8

# === 2026-08-19: STRIKE 闭环下降 (替代原半开环 strike_descent_rate=2.0) ===
#   computeSlantDescentSpeed 算 desired_vz = g.down / (time_to_hit + strike_vertical_lag_),
#   钳到 strike_descent_rate 后把闭环压成半开环:
#     - 本 bag (52m 水平 / 30m 高 / 10 m/s 水平) desired_vz=4.3 m/s,钳到 2.0 后
#       水平先到、垂直慢 10s 才落地,用户体验"下降速率不够"。
#   strike_vertical_lag 是末端让水平先于垂直命中的安全留余,2.0s 太大。
#   把 strike_descent_rate 提到 5.0 m/s 给闭环公式空间,strike_vertical_lag 砍到 0.5s。
#   兜底安全由 enforcePreCommitAltitudeGuard (二次钳,按实时几何算) 负责,
#   PX4 SITL 默认 MPC_Z_VEL_MAX_DN 约 2 m/s,真正饱和值由 PX4 内部限制,这里放高不引坠地。
strike_descent_rate: 5.0
strike_vertical_lag: 0.5

# PN专用目标输入滤波和陈旧目标软降速；IMAGE/GEO不使用这些滤波结果。
pn_target_filter_min_cutoff_hz: 1.0
pn_target_filter_beta: 0.005
pn_target_filter_d_cutoff_hz: 1.0
pn_cluster_stale_timeout_sec: 0.5
pn_cluster_stale_speed_scale: 0.33

# === 2026-08-19: 8m → 30m ===
#   原 8m 内图像射线趋近垂直、水平反复换向、SEARCH_TRACK + attack_cmd 直接
#   远距俯冲时 yaw 没追上 target bearing,IMAGE 射线 (image_ray_alpha=0.25 LPF
#   时间常数 ~0.4s) 滞后让速度方向偏,导致 UAV 越顶 41m 后 world coord 接管再反向。
#   把世界坐标接管半径提到 30m:水平 ≤ 30m 起就锁到稳定的 cluster 世界坐标,
#   仅 30m 以上才用 IMAGE 射线(yaw 误差此时较小)。skill 105 ATTACK 走 attack_point
#   waypoint 起跑距离小,这一改动对它的影响可忽略。
strike_slowdown_radius_m: 10.0
strike_horizontal_stop_radius_m: 1.0
strike_terminal_world_direction_radius_m: 30.0
# 近目标逐渐冻结偏航，避免机头在目标正上方来回寻找像面中心。
strike_yaw_freeze_radius_m: 3.0
# 每次进入 STRIKE 后必须收到本轮新目标坐标，且坐标持续保持新鲜。
strike_target_pose_timeout_sec: 0.5
# IMAGE/GEO 和末端方向变化统一经过速度指令斜率限制。
strike_max_horizontal_accel: 2.0
# //===================制导修改====================
# 原值保留：strike_max_vertical_accel: 1.0
strike_max_vertical_accel: 1.5
# //===================制导修改====================
strike_max_yaw_accel: 1.0
# //===================制导修改====================

# 制导通用参数（被 guidance_strategies 加载）
intercept_time_horizon: 5.0
v_max: 5.0
a_max: 10.0
polynomial_order: 10
sampling_interval: 0.01
trajectory_lookahead: 0.5
pos_p_gain: 1.0
vel_p_gain: 0.5
thrust_weight: 0.5

# === 2026-07-31: 比例导引 (PN) 专属参数 (InterceptGuidance) ===
# 注意: guidance_speed 实际由 mission_manager 在 Attack(IN_TASK) 期间通过
#   setUavSpeed() 动态下发 (skill.task_speed = attack_speed 字段;
#   mission_manager.yaml 的 ~max_speed 是兜底默认). 以下 5 个 YAML 参数
#   只在构造函数里读一次,作为"启动默认值 / 下发前的兜底上限".
strike_max_speed: 40.0           # STRIKE 水平速度上限 (m/s), 兜底默认
strike_max_vertical_speed: 3.0   # STRIKE 升降速度上限 (m/s)
nav_ratio: 0.5                   # 导航比 N: 1.0=纯追踪, 3~5=经典 PN. 起步用 1.5 偏稳
#                                  # (2026-08-01: 实测 1.5 在 1.0-1.7 Hz 形成闭环极限环,
#                                  #  俯仰/滚转 std≈5.9°/5.1°. 静止目标下 N=0.5 = 纯追踪,
#                                  #  环路增益 <1 不激发正反馈, 验证是否能压平振荡)
max_lead_angle_deg: 30.0         # 前置角约束: 合速度与 LOS 夹角超过此值则钳到边界 (deg)
# main分支增强值：1Hz抑制10Hz目标输入在PN 50Hz帧边界造成的LOS-rate尖峰。
# 原值保留：los_filter_cutoff_hz: 2.0
los_filter_cutoff_hz: 1.0        # 越高越跟手越抖,越低越平滑越滞后

# LOS 制导参数（仅 los_kp_yaw / los_max_rate 是节点专属，los_kp_pitch 在 strategies 中）
los_kp_yaw: 1.5
los_max_rate: 1.2

# TRACK 模式参数
track_altitude: 30.0
track_horiz_dist: 8.0
track_P: 1.0
track_I: 0.1
# === 2026-08-23: TRACK 模式 chase 速度最大上限 (CAP), 不是 chase 速度本身 ===
#   0.5 → 20.0:动目标 chase 需要 UAV 速度能追上 (用户口径 ≤17 m/s + 18% 余量)。
#   **注意**:uav_speed 是 chase **最大速度上限 (CAP)**,不是 chase 速度本身。
#   实际 chase 速度由 computeTrackVelocity 的 P-control 自然计算:
#     - 目标动 → KF lead_pose 让 horiz_dist 偏大 → chase 加速
#     - 目标静 → horiz_dist 趋向 stand-off (track_horiz_dist=8m) → chase 减速到悬停
#   设 20 m/s 是给 17 m/s 动目标留 18% 余量,UAV 不会真以 20 m/s 飞,
#   除非目标持续以 17 m/s 远离 stand-off。
# TRACK 模式专属速度上限（节点专属，不放 common.yaml）
uav_speed: 20.0
# 距离→速度的连续斜率：每超出 stand-off 1m 速度增加多少 m/s
# 用于消除接近目标时的硬切换（值越小接近越平缓）
track_k_approach: 0.5
# === 2026-08-23: 动目标 chase lead-bearing 兜底 ===
#   horiz_dist < 此值时 bearing 用 last_valid_target_bearing_nwu_ (sticky),
#   避免 atan2(0,0)=0 让 yaw 突然跳北
track_horiz_min_for_yaw_track_m: 5.0

# === 2026-08-24: chase 重构 — v_cmd = filtered_target_vel + K_p * (lead - uav) ===
#   旧版径向 P-control + body-frame 钳位(no_backward + yaw_threshold)在
#   大 yaw_err (>90°) 时把速度衰减到 ~3 m/s,动目标永远追不上。
#   新版直接在 NWU 世界坐标系下:
#     v_cmd = tv_filt + chase_K_p * (lead_pose - uav)
#     lead_pose = target_pose + tv_filt * lead_t
#     lead_t = clamp(horiz / (track_max_speed + 1), lead_min, lead_max)
#     |v_cmd| clamp 到 track_max_speed_,不再切 body-frame。
#   chase_K_p: 位置 P 增益,经验 0.5。动目标 K_p 太小追不上、太大会震荡
#              (与 KF 滤波速度共同决定 chase 稳态速度)。
#   chase_lead_min/max: lead_t 钳位 [0.2, 1.5]s,与 target_estimator motion_lead 对齐。
#   chase_yaw_horiz_min_m: horiz < 1m 时 yaw_rate=0 防 atan2(0,0) 跳变
#                          (不锁 desired_yaw,滑过目标下方时 yaw 自然恢复)。
chase_K_p: 0.5
chase_lead_min: 0.2
chase_lead_max: 1.5
chase_yaw_horiz_min_m: 1.0
# chase 用的目标速度 OneEuro LPF(独立于 vel_filter_,因为 chase 需要更跟手)。
# 默认 1.0Hz/0.005/1.0Hz,比 vel_filter_ 更跟手 → KF 速度变化能反映到 chase。
chase_vel_filter_min_cutoff_hz: 1.0
chase_vel_filter_beta: 0.005
chase_vel_filter_d_cutoff_hz: 1.0
# === 2026-08-24: chase 打击锥半角 — 锥外 P-control + 锥内纯速度 ===
#   锥半径 = altitude × cot(strike_angle),30m 高 + 30° 角 → 半径 52m
#     - 锥外:horiz_err = horiz - tolerance > 0 → 朝目标方向 K_p × excess
#     - 锥内:horiz_err = 0 → 只跟目标速度,不收位置(不再冲向目标正上方)
#   strike_angle 是相机下视角 (从水平往下),用户口径"30° 打击角"对应
#   cot=1.732。低空(<2m)夹紧到 2m 防止除零/异常。
track_strike_angle_deg: 30.0
