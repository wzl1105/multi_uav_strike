# ============================================================================
# target_estimator_node 专属参数 (多实例聚类 + per-bbox 反投影)
# 共享参数 (use_sim) 在 common.yaml 中定义,由 launch 加载。
#
# 工作流 (2026-07 多目标改造):
#   1. gimbal_simulator_node 每帧发布 YoloDetections (batch) — 每条对应一个 FOV 内目标
#   2. target_estimator_node 取每条 detection 的 bbox 中心,经 camera 几何反投影到
#      地面 (z=target_z_prior) → (nwu_x, nwu_y)
#   3. 遍历 clusters_, 找 label 相同 + 2D 距离 ≤ merge_radius_m_ 的最近 cluster 合并;
#      没命中 → 新建 cluster,并 publish 一次 cluster_event (mission_manager 据此上报 GS)
#   4. 10Hz 周期 publish cluster_states (所有 alive cluster) + primary cluster GPS/pose
#   5. primary = mission/primary_target 指定的 cluster_id; 0 或找不到 → 回退最高置信度
#
# 反投影与 gimbal_simulator 共用相机模型,所以下面的 image_width/height/fov_h/fov_v
# 必须与 gimbal_simulator.yaml 完全一致。
# ============================================================================

# ---- 聚类参数 ----
merge_radius_m: 10.0          # 2D 距离 ≤ 此值 → 合并到已有 cluster (米)
                              # === 2026-07-31: 30 → 10 ===
                              # 8 个 15m 间距的 person 各成独立 cluster, 不再被吞
                              # 同 label + 同区域才算同一实例;不同类别天然不会合并。
                              # === 2026-08-13: iter_09 — 20 → 15 ===
                              # iter_08 (20m) 出现 361m 远距合并伪影 (极端 case),
                              # 折中到 15m 应保留同车合并能力 + 避免远距误合并。
                              # === 2026-08-19: 15 → 10 (实机:小范围目标更稳) ===
                              # 实机两次飞行观察到远处同 label 投影噪声大,
                              # 10m 兼顾"同车跟踪稳定"+"远距不误合并"。
cluster_ttl_sec: 120.0        # 多久无新命中 → 释放 cluster (秒)
                              # === 2026-08-19: 60 → 120 (实机:防打击瞬间死掉) ===
                              # 问题:target_estimator TTL 默认 60s,但本 bag 实测 cluster 8
                              # 在 strike 前 14s 死掉(可能 promoted 状态被某种边界清掉)。
                              # 拉到 120s 给"飞过去再打"留两分钟 buffer。
min_hit_count: 15             # 同 cluster 被检测到这么多次才晋升为正式目标
                              # === 2026-07-16: 误检门禁 ===
                              # 10Hz yolo 下 20 hits ≈ 2s 持续命中,误检基本进不来;
                              # 真目标在视野停留 3~5s 时稳定晋升。
                              # 单次或零星命中被门禁过滤,不会触发 mission_manager 上报/跟踪。
                              # === 2026-08-19: 15 → 10 (实机:真目标 ~1s 内可达晋升) ===
                              # 设 ≤ 1 关闭门禁(每次命中都晋升,等价于老版行为)。
                              # === 2026-08-19 (本日): 10 → 15 (TTL 拉长后晋升门槛同步抬高) ===
                              # 15 hit ≈ 1.5s 持续命中,降低合并抖动导致的伪晋升。
tentative_ttl_sec: 1.0        # 未晋升的 tentative cluster 无新命中后多久丢弃 (秒)
                              # 比 cluster_ttl_sec 短得多 — tentative 没有发过 cluster_event,
                              # mission_manager 不感知,过期丢弃对上游无影响。
                              # === 2026-07-31: Attack 阶段用 attack_tentative_ttl_sec(2.0) ===
                              # 飞向 WP2 过程中目标停留时间短, 1s TTL 过紧,
                              # 6 hit 还没攒够就被 DROP
# === 2026-07-31: Attack(105) 阶段专享聚类门槛 ===
#   搜索阶段 (非 Attack) 保持 min_hit_count=10 抗误检
#   Attack 阶段 (skill_type==105 && phase GUIDANCE_TRACK/STRIKE) 切到 attack_min_hit_count=3
#   原因: Attack 飞向 WP2 过程中目标停留时间短, ~0.3s 命中即可晋升。
#   3 hit 已足够抗单帧 YOLO 误检 (假阳率 < 1e-3)
attack_min_hit_count: 3
attack_tentative_ttl_sec: 2.0
ema_alpha: 0.3                # 新观测权重(0=完全保留旧值, 1=完全用新值)
                              # === 2026-07-16: Plan B 世界空间 EMA ===
                              # EMA 直接作用于 cand 世界坐标 (米),相机机动零滞后。
                              # 0.3 + 10Hz → 时间常数 ≈ 0.23s,稳态世界噪声衰减 ~70%。
                              # 像素噪声大时降到 0.1~0.2;车辆/高速场景调到 0.4~0.5。
                              # === 2026-08-23: KF 替换 EMA ===
                              # 本参数现已不再被 processSingleDetection 使用 (KF 接管);
                              # 保留以防外部工具/老 config 仍依赖,无副作用。
target_z_prior: 0.0           # 反投影 z 假设(地面目标 = 0;空中目标可设 UAV 当前高度)

# === 2026-08-23: 动目标 KF + 模式分类 ===
#   4-state CV Kalman Filter [x, y, vx, vy] 替换原 2D EMA, 17 m/s 目标滞后从 3.97m 降到 0。
#   静目标零回归: motion_class_=STATIC 时 Q_vel=0.01, 速度自然衰减到 0, 等效位置 EMA。
#   lead_pose = KF + v*lead_time 让 chase 不滞后 (lead_time = clamp(horiz/closing, 0.2, 1.5)s)。
motion_cold_start_grace_sec: 1.0     # 聚类创建后强制 STATIC 时长 (防初始噪声)
motion_speed_enter: 2.0              # |v| > enter 连续 enter_frames 升 DYNAMIC (m/s)
motion_speed_exit: 0.3               # |v| < exit  连续 exit_frames  降 STATIC  (m/s)
motion_enter_frames: 3               # 升 DYNAMIC 所需连续帧数
motion_exit_frames: 30               # 降 STATIC  所需连续帧数
motion_lead_min: 0.2                 # lead_time 下限 (秒)
motion_lead_max: 1.5                 # lead_time 上限 (秒)
motion_max_speed: 30.0               # 发散保护: |v| > max → resetVelocity + STATIC (m/s)
kf_q_pos: 1.0                        # KF 位置过程噪声 std (m)
kf_q_vel_static: 0.01                # 静态目标速度过程噪声 std (m/s, 极小 → 衰减到 0)
kf_q_vel_dynamic: 2.0                # 动态目标速度过程噪声 std (m/s)
kf_r_meas: 2.0                       # YOLO 世界投影测量噪声 std (m)
uav_velocity_lpf_alpha: 0.5          # UAV 速度缓存 LPF alpha (一阶 IIR)
kf_predict_freq: 50.0                # KF 高频 predict timer 频率 (Hz, 应 >> YOLO 频率)
cluster_stale_freeze_sec: 3.0        # cluster 多久无观测 → reset velocity 强制 STATIC (秒)

# ---- 图像/位姿时间对齐 ----
# camera/pose 按时间缓存；每条 YoloDetection 使用与 stamp_us 时间差最小的样本。
# 时间差不作为拒绝条件，超过 warn 阈值仅打印诊断日志。
pose_buffer_duration_sec: 5.0
pose_sync_warn_threshold_sec: 0.1
max_cluster_yaw_rate_rad_s: 0.2
yaw_rate_sample_max_dt_sec: 0.5

# ---- 相机几何 (必须与对应 YOLO 生成端的相机模型同步) ----
#   真机: starling_gimbal 实际相机, FOV 由硬件实测给 (68/45.6) — 别动。
#   仿真: gimbal_simulator 默认 66/52, 在 iterate_target_estimator.launch 里
#         通过 param 覆盖 yaml 默认值,避免污染真机配置。
image_width: 1920
image_height: 1080
fov_h_deg: 68.0               # 水平 FOV(度) — 真机实测
fov_v_deg: 45.6               # 垂直 FOV(度);0 = 按方形像素从 fov_h 推导 — 真机实测

# ---- 发布频率 ----
states_publish_freq: 10.0     # cluster_states / target_estimated_marker / target_estimated_gps/pose 发布频率 (Hz)
# //===================制导修改====================
# guidance/primary_image_target 与 states_publish_freq 同步发布；消息内 stamp_us 保留
# YOLO 真正命中时刻，制导端不会把周期重复快照误判为新检测帧。
# //===================制导修改====================
cleanup_freq: 1.0             # 过期 cluster 清理频率 (Hz)

# ---- UAV Pose 输入 ----
uav_pose_topic: "mavros/local_position/pose"

# ---- 标记颜色 (RViz Marker, TextViewFacing 显示 label) ----
est_marker_r: 1.0
est_marker_g: 1.0
est_marker_b: 0.0
est_marker_a: 1.0
