# ============================================================================
# target_estimator_node 专属参数 (多实例聚类 + per-bbox 反投影)
# 共享参数 (use_sim) 在 common.yaml 中定义,由 launch 加载。
#
# 工作流 (2026-07 多目标改造):
#   1. gimbal_simulator_node 每帧发布 YoloDetections (batch) — 每条对应一个 FOV 内目标
#   2. target_estimator_node 取每条 detection 的 bbox 中心,经 camera 几何反投影到
#      地面 (z=target_z_prior) → (nwu_x, nwu_y)
#   3. 遍历 clusters_, 找 label 相同 + 2D 距离 ≤ merge_radius_m_ 的最近 cluster 合并;
#      没命中 → 新建 cluster,并 publish 一次 cluster_event (mission_manager 据此上报 GS)
#   4. 10Hz 周期 publish cluster_states (所有 alive cluster) + primary cluster GPS/pose
#   5. primary = mission/primary_target 指定的 cluster_id; 0 或找不到 → 回退最高置信度
#
# 反投影与 gimbal_simulator 共用相机模型,所以下面的 image_width/height/fov_h/fov_v
# 必须与 gimbal_simulator.yaml 完全一致。
#
# === 2026-08-13: iter_10 — Bag replay 兼容模式 ===
#   use_bag_replay_mode = true 时启用 3 个 bag-only workaround (详见下方):
#     1. cleanupTimerCb 用 wall-time 而非 msg stamp (绕开 4 yr 时间空洞)
#     2. projectPixelToGround 用 uav_pose 而非 camera_pose (绕开 camera/pose.position=(0,0,0))
#     3. horizontal/upward camera fallback 距离保留(实飞下不常触发但仍是防御性兜底)
#   实飞下应保持 false。详见 UpdateTargetEstimate.md "Bag vs 实飞修改分类" 表。
# ============================================================================

# ---- 聚类参数 ----
merge_radius_m: 15.0          # 2D 距离 ≤ 此值 → 合并到已有 cluster (米)
                              # === 2026-07-31: 30 → 10 ===
                              # 8 个 15m 间距的 person 各成独立 cluster, 不再被吞
                              # 同 label + 同区域才算同一实例;不同类别天然不会合并。
                              # === 2026-08-13: iter_09 — 20 → 15 ===
                              # iter_08 (20m) 出现 361m 远距合并伪影 (极端 case),
                              # 折中到 15m 应保留同车合并能力 + 避免远距误合并。
cluster_ttl_sec: 60.0         # 多久无新命中 → 释放 cluster (秒)
min_hit_count: 10             # 同 cluster 被检测到这么多次才晋升为正式目标
                              # === 2026-07-16: 误检门禁 ===
                              # 10Hz yolo 下 20 hits ≈ 2s 持续命中,误检基本进不来;
                              # 真目标在视野停留 3~5s 时稳定晋升。
                              # 单次或零星命中被门禁过滤,不会触发 mission_manager 上报/跟踪。
                              # 设 ≤ 1 关闭门禁(每次命中都晋升,等价于老版行为)。
                              # === 2026-08-13: iter_03 — 20 → 10 ===
                              # 1s 持续命中即晋升,短停留目标(飞过/Attack 起步)能晋升;
                              # 误检门禁仍由 1-tentative_ttl 兜底(单次命中 1s 内 expire)。
tentative_ttl_sec: 1.0        # 未晋升的 tentative cluster 无新命中后多久丢弃 (秒)
                              # 比 cluster_ttl_sec 短得多 — tentative 没有发过 cluster_event,
                              # mission_manager 不感知,过期丢弃对上游无影响。
                              # === 2026-07-31: Attack 阶段用 attack_tentative_ttl_sec(2.0) ===
                              # 飞向 WP2 过程中目标停留时间短, 1s TTL 过紧,
                              # 6 hit 还没攒够就被 DROP
# === 2026-07-31: Attack(105) 阶段专享聚类门槛 ===
#   搜索阶段 (非 Attack) 保持 min_hit_count=20 抗误检
#   Attack 阶段 (skill_type==105 && phase GUIDANCE_TRACK/STRIKE) 切到 attack_min_hit_count=6
#   原因: Attack 飞向 WP2 过程中目标停留时间短, 20 hit (~2s) 门槛过高导致 tentative TTL 满
#   还没攒够就被 DROP. 6 hit (~0.6s) 已足够抗单帧 YOLO 误检
attack_min_hit_count: 6
attack_tentative_ttl_sec: 2.0
ema_alpha: 0.1                # 新观测权重(0=完全保留旧值, 1=完全用新值)
                              # === 2026-07-16: Plan B 世界空间 EMA ===
                              # EMA 直接作用于 cand 世界坐标 (米),相机机动零滞后。
                              # 0.3 + 10Hz → 时间常数 ≈ 0.23s,稳态世界噪声衰减 ~70%。
                              # 像素噪声大时降到 0.1~0.2;车辆/高速场景调到 0.4~0.5。
target_z_prior: 0.0           # 反投影 z 假设(地面目标 = 0;空中目标可设 UAV 当前高度)
                              # === 2026-08-13: iter_07 — PROMOTE 最低置信度 ===
                              # 0.7 平衡值:YOLO 真目标通常 0.8+,误检 ~0.5。
                              # iter_06 实测:真车 conf_max=0.96 vs 误检 conf_max=0.50,
                              # 设 0.7 可保留全部真车 + 滤掉全部误检 PROMOTE。
                              # 真实场景:相机朝下视时 YOLO conf 更稳,可降到 0.5~0.6;
                              # 长距/小目标场景建议提到 0.8。
min_promote_confidence: 0.7

# ---- Bag replay 兼容模式 (iter_10) ----
use_bag_replay_mode: false     # true = 启用 bag-only workaround(详见文件头注释)
                               # false (实飞默认) = 正常行为
                               # 启用时:cleanupTimerCb 用 wall-time 而非 msg stamp
                               #        (绕开老 bag 4 yr 时间空洞)
                               # 注:cam_pos 永远用 uav_pose,camera/pose.position 不读

# ---- 图像/位姿时间对齐 ----
# camera/pose 按时间缓存；每条 YoloDetection 使用与 stamp_us 时间差最小的样本。
# 时间差不作为拒绝条件，超过 warn 阈值仅打印诊断日志。
pose_buffer_duration_sec: 5.0
pose_sync_warn_threshold_sec: 0.1
max_cluster_yaw_rate_rad_s: 0.2
yaw_rate_sample_max_dt_sec: 0.5

# ---- 相机几何 (必须与 gimbal_simulator.yaml 同步) ----
image_width: 1920
image_height: 1080
fov_h_deg: 66.0               # 水平 FOV(度)
fov_v_deg: 52.0               # 垂直 FOV(度);0 = 按方形像素从 fov_h 推导

# ---- 发布频率 ----
states_publish_freq: 10.0     # cluster_states / target_estimated_marker / target_estimated_gps/pose 发布频率 (Hz)
# //===================制导修改====================
# guidance/primary_image_target 与 states_publish_freq 同步发布；消息内 stamp_us 保留
# YOLO 真正命中时刻，制导端不会把周期重复快照误判为新检测帧。
# //===================制导修改====================
cleanup_freq: 1.0             # 过期 cluster 清理频率 (Hz)

# ---- UAV Pose 输入 ----
uav_pose_topic: "mavros/local_position/pose"

# ---- 标记颜色 (RViz Marker, TextViewFacing 显示 label) ----
est_marker_r: 1.0
est_marker_g: 1.0
est_marker_b: 0.0
est_marker_a: 1.0
