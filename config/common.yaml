# ============================================================================
# multi_uav_strike 共享参数 (Common parameters shared across nodes)
# ============================================================================
#
# 用法：在 launch 文件中通过 <rosparam command="load" file="..." /> 加载到节点
#       的私有命名空间（/<ns>/<node_name>/），与各节点专属 yaml 配合使用。
#
# PX4 SITL 与仿真模式的差别：
# - 仿真 (use_sim=true)：所有 UAV 共享同一 ref_lat/lon/alt
# - PX4 SITL (use_sim=false)：每个 UAV 用各自的 home 作为 ref_lat/lon/alt
#
# 参考点候选（默认使用安阳）：
#   安阳: ref_lat: 36.058800,  ref_lon: 114.557221, ref_alt: 63.0
#   北京: ref_lat: 40.151347, ref_lon: 116.980590, ref_alt: 31.0
# 切换：直接改下方 ref_lat/lon/alt 三个值即可。
# ============================================================================

# ----------------------------------------------------------------------------
# 仿真模式 (Simulation mode)
# ----------------------------------------------------------------------------
# true  = 使用 multimodequad_ros 仿真器（UAV 起始在指定高度，无须起飞）
# false = 使用 PX4 SITL + MAVROS（UAV 起始在地面，需要起飞流程）
use_sim: false

# ----------------------------------------------------------------------------
# GPS 参考点 (GPS reference point)
# 用于 NED <-> GPS 坐标转换、机间通信
# 仿真模式：所有 UAV 共享一个参考点
# PX4 SITL：每个 UAV 用各自的 home position
# ----------------------------------------------------------------------------
ref_lat: 36.058800        # 与 PX4 SITL 实例 0 的 home 对齐
ref_lon: 114.557221       # (lat/lon 由 /uav0/mavros/global_position/global 提供)
ref_alt: 63.0             # (实测 PX4 home altitude)
# ref_lat: 36.058800        # 旧值,保留作参考
# ref_lon: 114.557221
# ref_alt: 63.0

# ----------------------------------------------------------------------------
# 飞行模式代码 (PX4 flight mode codes)
# ----------------------------------------------------------------------------
flight_mode_velocity: 0   # OFFBOARD velocity control
flight_mode_position: 2   # OFFBOARD position control
flight_mode_attitude: 1   # OFFBOARD attitude control

# ----------------------------------------------------------------------------
# 避障参数 (Collision avoidance)
# ----------------------------------------------------------------------------
avoidance_safe_distance: 10.0  # 机间安全距离（米）

# ----------------------------------------------------------------------------
# 打击参数 (Strike parameters)
# ----------------------------------------------------------------------------
strike_distance_threshold: 2.0  # 打击距离阈值（米）
strike_min_altitude: 20.0       # 最小打击高度（米）
# Attack 提前下降与制导斜线下降共用的最大下降速率（m/s）。
# mission_manager 用它计算 WP1 准备高度，waypoint_executor 和 guidance_control
# 分别在航点段和图像/世界坐标制导段执行同一垂直限幅。
strike_descent_rate: 2.5

# ----------------------------------------------------------------------------
# 起飞参数 (Takeoff parameters, PX4 SITL only)
# ----------------------------------------------------------------------------
takeoff_altitude: 10.0     # 起飞目标高度（米，NED: z 向下为正）
max_takeoff_retries: 3     # 起飞失败最大重试次数
takeoff_retry_delay: 5.0   # 重试前等待时间（秒）

# ----------------------------------------------------------------------------
# 通信参数 (Communication)
# ----------------------------------------------------------------------------
neighbor_timeout: 5.0       # 邻居超时时间（秒）
target_share_interval: 1.0  # 目标信息共享间隔（秒）
telemetry_rate: 10          # 遥测发送频率（Hz）

# ============================================================================
# 已从 common.yaml 移除的节点专属参数（不要在此处恢复）：
# - uav_speed：节点专属（航点=5.0，TRACK=5.0，巡航=7.0），保留在 waypoint_executor.yaml / guidance_control.yaml
# - uav_name：由 launch 的 <param name="uav_name" /> 单独传入 comm_node
# ============================================================================
