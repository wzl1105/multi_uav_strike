# ============================================================================
# mission_manager_node 专属参数
# 共享参数（use_sim / ref_lat/lon/alt / avoidance_safe_distance /
#          strike_distance_threshold / takeoff_*）
# 已在 common.yaml 中定义，由 launch 加载到本节点的私有命名空间。
# ============================================================================

mission_loop_rate: 50.0
low_speed_threshold: 12.0
target_lock_confidence: 0.7
spiral_approach_duration: 10.0
spiral_approach_radius: 20.0
# 拦截速度(下发到 InterceptGuidance 替代 guidance_control.yaml 里的 uav_speed)
max_speed: 10.0
# Attack(105) 的速度必须由 Skill.task_speed 显式传入；这里只定义硬上限，
# 不作为缺失 task_speed 时的默认打击速度。代码不会允许上限超过 40m/s。
attack_max_speed: 40.0
# 起飞高度达标后的等待时间（缩短起飞流程用）
takeoff_stable_time: 1.0     # 高度达标后稳定时间（秒）
takeoff_hover_time: 0.5      # 悬停等待时间（秒）
# === Phase 7: 多机集结同步 ===
# 伙伴心跳超时(秒):超过此时长未刷新视为失联,失联 SN 从 arrived 集合中剔除
partner_heartbeat_timeout: 3.0
# 集结门限:到达伙伴数 / 期望伙伴数(去本机) ≥ 此值 → 推进下一条 skill
# 1.0 = 全部到齐才推进;0.7 = 70% 到齐即可(降级兼容掉队 UAV)
gather_threshold: 1.0

# === Attack(105) 多机协同参数(2026-07-26) ===
# formation=2 协同:每架 UAV attack_point 距目标保留的安全距离(避免贴脸,推荐 3m)
attack_safety_margin_m: 3.0
# formation=2 协同:UAV 距目标 < 此值时 attack_point = 当前位置(已在目标附近)
attack_close_range_threshold_m: 5.0
# formation=2 协同:strike_sync_time 相对最大飞行时间的额外缓冲秒数
attack_sync_strike_buffer_sec: 1.0
# formation=1/2 门控挂起 strike 的超时,超时则放弃当前 skill,转下一条
attack_strike_pending_timeout_sec: 60.0

# === Cluster 上报新鲜度门槛(2026-07-29,可调) ===
# UAV 安全门:cluster.last_seen_us 距今 > 此值 → 拒绝触发 strike(stale 坐标会让
#   UAV 飞向错位置),同时 erase strike_dispatched_ 允许下一帧重新派发。
#   无差别应用,不受"是否已上报过"影响。
# 推荐:0.3 ~ 1.0(太短会 GUIDANCE_STRIKE ↔ TARGET_LOST_HOVER 频繁跳变,太长会飞 stale 坐标)
max_strike_cluster_age_sec: 1.5   # 2026-08-02: 0.5 → 1.5. target_estimator 10Hz
#                                       下 0.5s 内常因 NPU 卡顿漏帧, STALE-strike 把
#                                       strike 掐死在 2~3s 内(分析 09:18 bag 验证),
#                                       1.5s 给 15 帧冗余窗口, 仍远小于 stale 坐标的
#                                       误触发风险

# GS 上报门:cluster.last_seen_us 距今 > 此值 → 拒绝**重复上报**(已上报过的 cluster
#   再报一次必须是新鲜坐标,避免 GS 反复收到 stale 数据)。
#   首次上报豁免(stale 也允许先报一次,免得永久漏报)。
# 推荐:3.0 ~ 10.0(默认 5.0,适配 8m/s × 10m 目标视野 ~1.5~3s 出 FOV,留 2x 余量)
# 测试时可放宽到 30.0+ 看是否首次上报真的能补回老目标
max_report_cluster_age_sec: 5.0

# === Cluster 位置栅格去重半径(2026-07-29,可调) ===
# 同 label 新 cluster 与 reported_to_gs_ 中某条记录 2D 距离 < 此值 → 视为同一物理
#   目标,跳过(弥补 C1 cluster_id dedup 在 60s cluster TTL 重建后的漏洞)。
# 必须 ≥ target_estimator.merge_radius_m(target_estimator.yaml,默认 10m),
#   否则 EMA 漂移会让 C2 漏抓造成重复上报。
# === 2026-07-31: 40 → 25 ===
# 跟随 target_estimator.merge_radius_m=10, 留 2.5x EMA 噪声 + WP2-gate 余量
# === 2026-08-19: 25 → 15 (uav0_strike_2026-08-19-15-39-13_0.bag) ===
# 25m 时 SIM car (-30,-130) 旁边的 car cluster + 一个误检 person cluster
#   各自独立报一次,GS 看到 2 条相同物体会要求多机协调(但 SIM 是单机)。
# 15m (1.5x merge_radius) 把相邻真目标合并,远距伪目标仍能各自上报。
report_dedup_radius_m: 15.0

# === 云台俯仰角控制(2026-07-29) ===
# Search(102) 任务激活期间,把 Skill.gimbal_pitch 持续低频下发到 /<ns>/mission/gimbal_command
#   (Float32,度)。任务结束后(进入 EXIT_PENDING/FAILED 或新 task_flow 覆盖)恢复该默认值。
# 推荐:0.0(水平,云台归位);典型搜索场景 -15 ~ -45(下俯)
gimbal_pitch_default: 0.0
# mission/gimbal_command 下发频率(Hz)。不需要高频(云台伺服惯性大),5Hz 已够响应
#   gimbal_control_node 的闭环,过低(<2)会让 gimbal 抖动时显得"延迟大"
gimbal_command_rate_hz: 5.0

# === Attack(105) WP2-gate(2026-07-30) ===
# cluster 必须落在 WP2 周围此半径内才允许 strike/锁定,
#   避免飞向 WP2 途中被远处的"伪目标"抢先锁走、UAV 飞离攻击方向。
# 推荐 20~40;过大容易混进临近目标,过小会错过 YOLO 反投影抖动(默认 30m)
wp2_strike_radius_m: 30.0
# UAV 到 attack_point 后,从未找到任何 WP2 范围内目标时的长悬停上限(秒)。
# 用于"确实没有目标就悬停"的语义,远大于 attack_hover_timeout_sec_(30s)。
# 推荐 120~600;过短会"还没看清就放弃",过长会卡死仿真
attack_no_target_hold_sec: 300.0

# === Attack(105) 云台联动(2026-07-30) ===
# 105 阶段从 WP1 到达开始,延时 N 秒后云台才开始朝 WP2 看。
# 避免在 WP1 短暂悬停时云台就转头乱抖。
# 推荐 1~3;过短会在 WP1 悬停时云台就乱抖,过长会错过 WP1→WP2 段目标搜索时机
attack_wp2_look_delay_sec: 2.0
# 105 阶段尚未到达 WP1 或延时内时的云台默认俯仰角(度,正值=下视,GS 语义)。
# 默认 0=水平;非零可让云台保持搜索姿态等 WP1
attack_gimbal_look_default_pitch_deg: 0.0

# === CODEX DIRECT-LOOK START ===
# 兼容参数保留。按当前任务约束，Attack 必须先到 WP1 才开启聚类，
# 所以预 WP1 DIRECT_LOOK 在代码中强制禁用；WP1 后看到目标由标准主路径立即打击。
attack_direct_look_enabled: false
# 从开始转动机头/云台算起的总预检窗口（秒）。
attack_direct_look_timeout_sec: 4.0
# 前段只用于机头和云台稳定，不累计检测帧（秒）。
attack_direct_look_settle_sec: 1.5
# 用户确认要求：同一 cluster 必须连续检测 3 帧。
attack_direct_look_confirm_hits: 3
# === CODEX DIRECT-LOOK END ===
