# ============================================================================
# waypoint_executor_node 专属参数
# 共享参数（use_sim / ref_lat/lon/alt / flight_mode_* / avoidance_safe_distance）
# 已在 common.yaml 中定义，由 launch 加载到本节点的私有命名空间。
# ============================================================================

executor_rate: 50.0             # 执行循环频率（Hz）
# 航点飞行专属速度上限（节点专属，不放 common.yaml）
uav_speed: 2.0
uav_vertical_speed: 3.0
arrival_threshold: 1.0          # 到达阈值（米）
use_desired_yaw_from_wp: true
# 最后一个航点位置保持 P-controller 增益（1m 误差 → kp m/s，调小会更稳但恢复慢）
hold_kp: 0.8
# 避障 reverse_allowed 生效时(critical 冲突)沿段方向后退的速度（m/s）
reverse_speed: 1.0

# ===== L1 横向控制(压线)=====
#   L1_min: look-ahead 距离下限(m),低速段使用。
#     减小 → 横向响应更尖锐、贴线更紧,但 < 2m 易高频抖动;
#     增大 → 响应更平滑,但"画龙"超调更明显(原硬编码 5.0 → 推荐 3.0)。
#   L1_period: 高速段 L1 = cur_speed * L1_period(m)。
#     减小 → 高速时贴线更紧;增大 → 高速时更平滑但超调大(原 1.0 → 推荐 0.6)。
L1_min: 3.0
L1_period: 0.6
# ===== L1 自适应增强(2026-08-02 兼容低速 + 高速)=====
# 经验问题:低速 4 m/s 时 L1 卡 L1_min=3 m,XTE 1 m 量级摆动引起 yaw 跟踪滞后
#   → L1 bearing 反向 → 5 s 周期画龙。
#   l1_min_period: 把固定 L1_min 替换为 max(L1_min, v * l1_min_period),
#     让 L1 跟随速度:4 m/s → ~4.8 m(原 3.0),15 m/s → ~18 m(原 9.0)。
#     0 = 关闭,保留旧行为。
#   xte_damping_gain: 在 L1 bearing 上叠加 atan2(-XTE, L1) * gain 的反向角度
#     补偿,自动按 L1 缩放,一个 gain 同时兼容低速强纠偏和高速弱纠偏。
#     0 = 关闭;推荐 1.0,>1.5 会让短段 yaw 误差反向放大。
#   xte_damping_min_along_fraction: 阻尼门控,只在 along > fraction * seg_len
#     时启用,避免段头/短连接段误触发。默认 0.25;调大(如 0.5)更保守,调小
#     (如 0.1)更激进。
l1_min_period: 1.2
xte_damping_gain: 1.0
xte_damping_min_along_fraction: 0.25

# ===== 航向 P-controller(机头跟踪 L1 bearing)=====
#   yaw_max_rate: 角速度饱和上限(rad/s),避免 P 输出过旋转。
#   yaw_kp: 转弯期 yaw 跟踪 L1 bearing 的紧度。
#     增大 → 航向跟踪更紧(转弯期 yaw 更快对齐速度方向,减小侧滑);
#     过大会震荡(原硬编码 2.0 → 推荐 3.0)。
#   yaw_deadband: 航向误差死区(rad),低于此值不旋转,避免小幅抖动(保持 0.05 ~3°)。
yaw_max_rate: 1.0
yaw_kp: 3.0
yaw_deadband: 0.05

# 楼体越障默认关闭，由 UAV0 专用演示 launch 开启。
lidar_building_avoidance_enabled: false
lidar_climb_rate: 1.0
lidar_clear_confirm_time: 3.0
lidar_timeout: 0.5
lidar_max_relative_altitude: 500.0
lidar_slowdown_distance: 300.0
lidar_climb_trigger_distance: 100.0
lidar_stop_distance: 20.0

# === Attack(105) 专用参数(2026-07-26) ===
# Attack(105) 飞行高度下限(NED)。
# 注:此处只钳飞行轨迹(沿 WP1→WP2 直线钳到 attack_min_altitude_ned_),不修改 WP2 坐标本身。
# 默认 -20m = 相对 home 20m AGL。若 GS 发目标 MSL=0(地面),UAV 飞 WP2 时
# 实际以 20m AGL 直线飞向 WP2,水平方向对准目标,vertical strike 由 guidance 接管。
attack_min_altitude_ned: -20.0
