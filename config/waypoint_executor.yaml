# ============================================================================
# waypoint_executor_node 专属参数
# 共享参数（use_sim / ref_lat/lon/alt / flight_mode_* / avoidance_safe_distance）
# 已在 common.yaml 中定义，由 launch 加载到本节点的私有命名空间。
# ============================================================================

executor_rate: 50.0             # 执行循环频率（Hz）
# 航点飞行专属速度上限（节点专属，不放 common.yaml）
uav_speed: 2.0
uav_vertical_speed: 3.0
arrival_threshold: 1.0          # 到达阈值（米）
use_desired_yaw_from_wp: true
# 最后一个航点位置保持 P-controller 增益（1m 误差 → kp m/s，调小会更稳但恢复慢）
hold_kp: 0.8
# 避障 reverse_allowed 生效时(critical 冲突)沿段方向后退的速度（m/s）
reverse_speed: 1.0

# ===== L1 横向控制(压线)=====
#   L1_min: look-ahead 距离下限(m),低速段使用。
#     减小 → 横向响应更尖锐、贴线更紧,但 < 2m 易高频抖动;
#     增大 → 响应更平滑,但"画龙"超调更明显(原硬编码 5.0 → 推荐 3.0)。
#   L1_period: 高速段 L1 = cur_speed * L1_period(m)。
#     减小 → 高速时贴线更紧;增大 → 高速时更平滑但超调大(原 1.0 → 推荐 0.6)。
L1_min: 3.0
L1_period: 0.6
# ===== L1 自适应增强(2026-08-02 兼容低速 + 高速)=====
# 经验问题:低速 4 m/s 时 L1 卡 L1_min=3 m,XTE 1 m 量级摆动引起 yaw 跟踪滞后
#   → L1 bearing 反向 → 5 s 周期画龙。
#   l1_min_period: 把固定 L1_min 替换为 max(L1_min, v * l1_min_period),
#     让 L1 跟随速度:4 m/s → ~4.8 m(原 3.0),15 m/s → ~18 m(原 9.0)。
#     0 = 关闭,保留旧行为。
# ===== XTE 直接 P 控制(2026-08-03 重构)=====
#   旧 xte_damping_gain + atan2(-XTE, L1) 链路已废弃(改后实测长段 XTE P95
#   从 0.5m 改善到 0.39m,短段 0.96m → 0.68m)。代码里这些参数保留为 no-op,
#   避免 yaml 残留报错。
#   新方案:直接把 XTE 用 v_lateral 表达,完全绕开 yaw 角度链路:
#     v_lateral = -XTE / xte_tau_lookahead
#   物理量,PX4 速度层直接接收,XTE 一阶收敛,无 yaw 滞后引起的振荡。
#   xte_tau_lookahead: XTE 收敛时间常数(s),本节点当前默认 2.5(更稳):
#     0.5s:大半段(3-5s)XTE < 0.05m,极快收敛(可能 yaw 跟不上)
#     1.0s:平衡快与稳
#     1.5s:C++ 默认;5s 段长 XTE < 0.07m
#     2.5s:本 yaml 当前值;10s 长段 XTE < 0.05m,最稳
#   毕达哥拉斯约束 v_lateral² + v_along² ≤ v_cruise²,XTE 极大时自动限到
#   v_along 范围内,不会过冲。
#   同时:executeSegmentFlight() 段切换时 fall-through,不再 publishZeroVelocity()
#   后 return,消除 20ms bearing 阶跃缺口。旧代码会触发 yaw-rate ±1700°/s 尖峰,
#   fall-through 修后实测最大 yaw-rate < 65°/s(2026-08-03 bag 验证)。
l1_min_period: 1.2
xte_tau_lookahead: 2.5
# 旧参数保留为 no-op,加载不生效,避免 yaml 残留报错
xte_damping_gain: 0.0
xte_damping_min_along_fraction: 0.0

# ===== 航向 P-controller(机头跟踪 vx/vy 反算 bearing)=====
#   yaw_max_rate: 角速度饱和上限(rad/s),避免 P 输出过旋转。
#     === 2026-08-19: 0.5 → 1.0 (Fix A) ===
#     0.5 rad/s 太慢,154° 偏差需 5.4s,UAV 沿旧方向漂 75m。
#     1.0 rad/s (≈57°/s) 给 PX4 物理上限 (~3 rad/s) 留 3 倍余量,
#     残差由 Fix C 预转向彻底消除。1.5 偏激进,YAW 速率饱和后 PX4
#     内环可能短暂姿态震荡。
#   yaw_kp: 转弯期 yaw 跟踪 bearing 的紧度。
#     增大 → 航向跟踪更紧(转弯期 yaw 更快对齐速度方向,减小侧滑);
#     过大会震荡(原硬编码 2.0 → 推荐 3.0)。
#   yaw_deadband: 航向误差死区(rad),低于此值不旋转,避免小幅抖动。
#     0.02 rad ≈ 1.15°;过大死区会让 L1=18m 下 XTE<0.9m 时 yaw 不响应,
#     产生 0.85 Hz 极限环;过小(< 0.01)会让 yaw 控制器对 XTE 抖动敏感。
yaw_max_rate: 1.0
yaw_kp: 3.0
yaw_deadband: 0.02

# ===== 速度斜坡 (2026-08-19 Fix B) =====
#   publish path 上饱和 |Δv_horiz| ≤ vel_slew_max_horiz_accel × dt,
#   |Δvz| ≤ vel_slew_max_vert_accel × dt,把段切换 / phase 切换的硬切阶
#   跃在 2~3 s 内铺平,避免 PX4 OFFBOARD 收到 19 m/s 单 tick 跳变。
#   正常 L1 控制 delta 在 0.05~0.1 m/s/tick,远低于限幅 → 透明;
#   仅段切换 (>5 m/s 跳变) 时启动斜坡。
#   不影响压线:XTE 反馈由 L1 τ=2.5s 决定稳态,~100ms 斜坡窗口里
#   XTE 漂移可忽略。
vel_slew_max_horiz_accel: 8.0   # m/s²,水平速度斜坡上限 (≈ tick 0.16 m/s)
vel_slew_max_vert_accel: 4.0    # m/s²,垂直速度斜坡上限

# ===== WP1 预转向 (2026-08-19 Fix C) =====
#   接近 WP1(段末 / 相切换)< pre_align_radius_ 起,blend desired_yaw 朝
#   下一段方向(WP1→WP2 direction),smoothstep 让到达 WP1 时 desired_yaw
#   已经对齐,无阶跃切换。154° 转弯变成"接近过程里慢慢转",UAV 不再
#   在 WP1 瞬间换向。
#   仅 attack (skill 105) 且下一段存在时启用,不影响搜索模式。
pre_align_radius: 30.0           # m,WP1 预转向触发半径

# 楼体越障默认关闭，由 UAV0 专用演示 launch 开启。
lidar_building_avoidance_enabled: false
lidar_climb_rate: 1.0
lidar_clear_confirm_time: 3.0
lidar_timeout: 0.5
lidar_max_relative_altitude: 500.0
lidar_slowdown_distance: 300.0
lidar_climb_trigger_distance: 100.0
lidar_stop_distance: 20.0

# === Attack(105) 专用参数(2026-07-26) ===
# Attack(105) 飞行高度下限(NED)。
# 注:此处只钳飞行轨迹(沿 WP1→WP2 直线钳到 attack_min_altitude_ned_),不修改 WP2 坐标本身。
# 默认 -20m = 相对 home 20m AGL。若 GS 发目标 MSL=0(地面),UAV 飞 WP2 时
# 实际以 20m AGL 直线飞向 WP2,水平方向对准目标,vertical strike 由 guidance 接管。
attack_min_altitude_ned: -20.0
